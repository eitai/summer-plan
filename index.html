<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>תוכנית הקיץ</title>
<meta name="theme-color" content="#262626">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;600;700&display=swap" rel="stylesheet">
<style>
/* ── Lightroom Classic palette ────────────────────────────── */
:root{
  --bg:#262626; --panel:#2f2f2f; --raise:#383838; --loupe:#1c1c1c;
  --seam:#171717; --edge:#404040;
  --txt:#bdbdbd; --dim:#8a8a8a; --dimmer:#666; --white:#e9e9e9;
  --accent:#4b9fd5; --accent-dim:#2f6f96;
  --row:44px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:400 14px/1.45 Assistant,-apple-system,Segoe UI,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::selection{background:var(--accent-dim);color:#fff}

/* ── shell ────────────────────────────────────────────────── */
#app{
  height:100dvh; display:grid;
  grid-template-columns:248px 1fr 268px;
  grid-template-rows:46px 1fr 112px;
  grid-template-areas:"left top right" "left main right" "film film film";
}
@media(max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:46px 1fr 98px;
       grid-template-areas:"top" "main" "film"}
  #left{display:none}
}

/* ── top bar ──────────────────────────────────────────────── */
#top{
  grid-area:top; background:var(--bg); border-bottom:1px solid var(--seam);
  display:flex; align-items:center; gap:14px; padding:0 16px;
}
#brand{font-weight:700;letter-spacing:.2px;color:var(--white);font-size:15px}
#brand span{font-weight:300;color:var(--dimmer);margin-inline-start:10px;font-size:12.5px}
#top .sp{flex:1}
#status{
  font-size:11.5px;color:var(--dimmer);letter-spacing:.3px;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
#status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dimmer)}
#status.ok::before{background:#5c9e5c}
#status.busy::before{background:var(--accent)}
#status.err::before{background:#c46}
#gear{display:none;font-size:16px;color:var(--dim);padding:4px 6px}
#gear:hover{color:var(--white)}
@media(max-width:900px){#gear{display:block} #brand span{display:none}}

/* ── side panels ──────────────────────────────────────────── */
.panel{background:var(--panel);overflow-y:auto;overscroll-behavior:contain}
#left{grid-area:left;border-inline-end:1px solid var(--seam)}
#right{grid-area:right;border-inline-start:1px solid var(--seam)}
.ph{
  padding:11px 14px 9px; font-size:10.5px; font-weight:700; letter-spacing:1.4px;
  color:var(--dim); text-transform:uppercase;
  background:var(--bg); border-bottom:1px solid var(--seam);
  position:sticky; top:0; z-index:2;
}
.pb{padding:8px 0 14px}

/* folder-tree day list */
.month{padding:9px 14px 5px;font-size:12px;color:var(--dim);font-weight:600}
.dayrow{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:6px 14px;text-align:start;color:var(--txt);font-size:13px;
}
.dayrow:hover{background:#383838}
.dayrow.on{background:#454545;color:var(--white)}
.dayrow .num{width:20px;color:var(--dim);font-variant-numeric:tabular-nums;font-size:12px}
.dayrow.on .num{color:var(--white)}
.dayrow .cnt{margin-inline-start:auto;font-size:11px;color:var(--dimmer);font-variant-numeric:tabular-nums}
.dayrow.today .num{color:var(--accent)}

/* right panel controls */
.grp{border-bottom:1px solid var(--seam);padding:12px 14px 15px}
.grp h4{font-size:11px;font-weight:700;letter-spacing:1.1px;color:var(--dim);margin-bottom:11px;text-transform:uppercase}
.slider{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.slider label{font-size:12.5px;color:var(--txt);width:34px}
.slider input[type=range]{flex:1;-webkit-appearance:none;appearance:none;background:none;height:16px}
.slider input[type=range]::-webkit-slider-runnable-track{height:2px;background:#555;border-top:1px solid #1e1e1e}
.slider input[type=range]::-moz-range-track{height:2px;background:#555}
.slider input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:11px;height:11px;border-radius:50%;
  background:#d0d0d0;border:1px solid #111;margin-top:-5px}
.slider input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#d0d0d0;border:1px solid #111}
.slider .val{
  width:46px;text-align:center;font-size:12px;color:var(--white);
  background:#222;border:1px solid var(--seam);border-radius:2px;padding:2px 0;
  font-variant-numeric:tabular-nums}
.btn{
  display:block;width:100%;padding:7px;margin-top:7px;font-size:12.5px;color:var(--txt);
  background:linear-gradient(#3f3f3f,#333);border:1px solid var(--seam);border-radius:3px}
.btn:hover{background:linear-gradient(#484848,#3b3b3b);color:var(--white)}
.hint{font-size:11.5px;color:var(--dimmer);line-height:1.6;margin-top:9px}

/* ── loupe / main ─────────────────────────────────────────── */
#main{grid-area:main;background:var(--loupe);overflow-y:auto;overscroll-behavior:contain}
#head{
  padding:22px 30px 16px;border-bottom:1px solid #111;
  position:sticky;top:0;background:var(--loupe);z-index:3}
#head h1{font-size:26px;font-weight:300;color:var(--white);letter-spacing:-.2px}
#head h1 b{font-weight:700}
#head p{font-size:12px;color:var(--dimmer);margin-top:3px}
#rows{padding:14px 30px 40px;max-width:780px}
@media(max-width:900px){#head{padding:16px 16px 12px}#head h1{font-size:20px}#rows{padding:10px 12px 28px}}

.r{display:flex;align-items:center;gap:10px;border-bottom:1px solid #232323;min-height:var(--row)}
.r:hover{background:#202020}
.r input[type=time]{
  width:74px;flex:none;background:none;border:0;color:var(--dim);
  font-size:12.5px;font-variant-numeric:tabular-nums;padding:4px 2px;cursor:pointer}
.r input[type=time]:hover{color:var(--white)}
.r input[type=time]:focus{outline:1px solid var(--accent-dim);color:var(--white)}
.r input[type=text]{
  flex:1;background:none;border:0;padding:11px 6px;color:var(--txt);font-size:14.5px;min-width:0}
.r input[type=text]:focus{outline:none;color:var(--white)}
.r input[type=text]::placeholder{color:#3a3a3a}
.r.full input[type=time]{color:var(--accent)}
.r .x{
  flex:none;width:26px;color:#3a3a3a;font-size:15px;line-height:1;opacity:0;transition:opacity .1s}
.r:hover .x,.r:focus-within .x{opacity:1}
.r .x:hover{color:#c46}
@media(hover:none){.r .x{opacity:1}}
#add{margin-top:14px;font-size:12.5px;color:var(--dim);padding:6px 2px}
#add:hover{color:var(--accent)}

/* ── filmstrip ────────────────────────────────────────────── */
#film{
  grid-area:film;background:#1a1a1a;border-top:1px solid var(--seam);
  display:flex;gap:1px;overflow-x:auto;overflow-y:hidden;padding:9px;
  scrollbar-width:thin;scroll-behavior:smooth}
.cell{
  flex:none;width:78px;background:#2b2b2b;border:1px solid #141414;border-radius:2px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--dim);padding:6px 4px}
.cell:hover{background:#363636}
.cell.on{background:#5a5a5a;color:var(--white);border-color:#777}
.cell .d{font-size:20px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.1}
.cell.on .d{color:#fff}
.cell .w{font-size:10.5px;letter-spacing:.3px}
.cell .m{font-size:9.5px;color:var(--dimmer);letter-spacing:.4px}
.cell.on .m{color:#ddd}
.cell .bar{width:34px;height:2px;background:#3d3d3d;margin-top:3px;border-radius:1px;overflow:hidden}
.cell .bar i{display:block;height:100%;background:var(--accent)}
.cell.today{border-color:var(--accent-dim)}
@media(max-width:900px){.cell{width:64px}.cell .d{font-size:17px}}

/* ── mobile settings drawer ───────────────────────────────── */
@media(max-width:900px){
  #right{
    position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:20;
    transform:translateX(-100%);transition:transform .18s ease;
    box-shadow:0 0 40px #000}
  html[dir=rtl] #right{inset:0 0 0 auto;transform:translateX(100%)}
  #right.open{transform:none!important}
  #veil{position:fixed;inset:0;background:#000a;z-index:19;display:none}
  #veil.open{display:block}
}
</style>
</head>
<body>

<div id="app">
  <header id="top">
    <div id="brand">תוכנית הקיץ <span>8 באוגוסט – 1 בספטמבר 2026</span></div>
    <div class="sp"></div>
    <div id="status">טוען…</div>
    <button id="gear" title="הגדרות">⚙</button>
  </header>

  <aside id="left" class="panel">
    <div class="ph">ימים</div>
    <div class="pb" id="daylist"></div>
  </aside>

  <main id="main">
    <div id="head"><h1></h1><p></p></div>
    <div id="rows"></div>
  </main>

  <aside id="right" class="panel">
    <div class="ph">הגדרות</div>
    <div class="grp">
      <h4>טווח שעות</h4>
      <div class="slider">
        <label>מ־</label>
        <input type="range" id="from" min="0" max="23" step="1">
        <div class="val" id="fromV"></div>
      </div>
      <div class="slider">
        <label>עד</label>
        <input type="range" id="to" min="0" max="23" step="1">
        <div class="val" id="toV"></div>
      </div>
      <p class="hint">הטווח קובע אילו שעות מוצגות בכל יום. אפשר תמיד להוסיף שעה משלך, ולערוך כל שעה בלחיצה עליה.</p>
    </div>
    <div class="grp">
      <h4>יום</h4>
      <button class="btn" id="copyPrev">העתק מהיום הקודם</button>
      <button class="btn" id="clearDay">נקה את היום הזה</button>
    </div>
    <div class="grp">
      <h4>סנכרון</h4>
      <button class="btn" id="link"></button>
      <p class="hint" id="syncHint"></p>
    </div>
    <div class="grp">
      <h4>גיבוי</h4>
      <button class="btn" id="exp">ייצוא לקובץ</button>
      <button class="btn" id="imp">ייבוא מקובץ</button>
    </div>
  </aside>

  <div id="film"></div>
</div>
<div id="veil"></div>

<script>
/* ═══ סנכרון ═══════════════════════════════════════════════
   הנתונים נשמרים כמסמך JSON יחיד בשורה אחת ב-Supabase.
   כברירת מחדל הכתובת והמפתח נשמרים ב-localStorage של כל מכשיר
   בנפרד ("חבר סנכרון" בפאנל ההגדרות) — כדי שלא ישבו בקוד של
   אתר ציבורי. אם לא אכפת שהלוח יהיה גלוי, אפשר למלא אותם כאן
   פעם אחת ואז שום מכשיר לא צריך להתחבר.                    */
const CONFIG = { url:"https://xzeshpxkgwrgsfjogtho.supabase.co",
                 key:"sb_publishable_6CQcIi4__CXRgadDg9zIvw_yQrJpPA6" };
const URLK='sp-url', KEYK='sp-key';
// מקבל גם את כתובת ה-REST מעמוד Data API, לא רק את ה-Project URL
const sbUrl = () => (localStorage.getItem(URLK) || CONFIG.url || '')
                      .trim().replace(/\/+$/,'').replace(/\/rest\/v1$/,'');
const sbKey = () =>  localStorage.getItem(KEYK) || CONFIG.key || '';
/* ══════════════════════════════════════════════════════════ */

const START='2026-08-08', END='2026-09-01', LS='summer-plan';
const WD=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const MO=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>new Date(s+'T00:00:00');
const DAYS=(()=>{const a=[],d=parse(START),e=parse(END);while(d<=e){a.push(iso(d));d.setDate(d.getDate()+1)}return a})();
const TODAY=iso(new Date());

let S={v:1,updatedAt:0,range:{from:8,to:22},days:{}};
let sel=DAYS.includes(TODAY)?TODAY:DAYS[0];
let dirty=false, saveT, scrolledTo=null;
let linked = !!(sbUrl() && sbKey());

/* ── remote: the whole doc as jsonb in plan(id=1) ─────────── */
const R = {
  h(){ const k=sbKey();
       return {apikey:k, Authorization:'Bearer '+k, 'Content-Type':'application/json'}; },
  async load(){
    const r=await fetch(`${sbUrl()}/rest/v1/plan?id=eq.1&select=doc`,
                        {headers:this.h(), cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    return (await r.json())[0]?.doc || null;
  },
  async save(doc){
    const r=await fetch(`${sbUrl()}/rest/v1/plan`,{method:'POST',
      headers:{...this.h(), Prefer:'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify({id:1,doc})});
    if(!r.ok) throw new Error(r.status);
  }
};

const $=s=>document.querySelector(s);
const say=(t,c='')=>{const e=$('#status');e.textContent=t;e.className=c};

function touch(){
  S.updatedAt=Date.now();
  localStorage.setItem(LS,JSON.stringify(S));
  dirty=true;
  if(!linked){say('נשמר במכשיר','ok');return}
  say('שומר…','busy');
  clearTimeout(saveT); saveT=setTimeout(push,700);
}
async function push(){
  try{ await R.save(S); dirty=false;
       say('מסונכרן · '+new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}),'ok'); }
  catch(e){ say('אין חיבור — נשמר במכשיר','err'); clearTimeout(saveT); saveT=setTimeout(push,8000); }
}
async function pull(){
  if(!linked||dirty||document.activeElement?.tagName==='INPUT') return;
  try{
    const r=await R.load();
    if(r && r.updatedAt>S.updatedAt){ S=r; localStorage.setItem(LS,JSON.stringify(S)); render(); }
    say('מסונכרן','ok');
  }catch(e){ say('אין חיבור — נשמר במכשיר','err'); }
}

/* ── times shown for a day: the range template ∪ saved hours ─ */
function timesFor(day){
  const set=new Set();
  for(let h=S.range.from;h<=S.range.to;h++) set.add(String(h).padStart(2,'0')+':00');
  Object.keys(S.days[day]||{}).forEach(t=>set.add(t));
  return [...set].sort();
}
const filled=day=>Object.values(S.days[day]||{}).filter(v=>v.trim()).length;
const dayOf=day=>(S.days[day]||=({}));
const put=(day,t,v)=>{ dayOf(day)[t]=v; touch(); };

/* ── render ────────────────────────────────────────────────── */
function render(){
  const d=parse(sel);
  $('#head h1').innerHTML=`יום <b>${WD[d.getDay()]}</b>, ${d.getDate()} ב${MO[d.getMonth()]}`;
  const n=filled(sel);
  $('#head p').textContent = n ? `${n} פעילויות מתוכננות` : 'עדיין לא תוכנן כלום';

  const rows=$('#rows'); rows.textContent='';
  const data=S.days[sel]||{};
  for(const t of timesFor(sel)){
    const val=data[t]||'';
    const r=document.createElement('div');
    r.className='r'+(val.trim()?' full':'');
    r.innerHTML=`<input type="time" dir="ltr" value="${t}">
      <input type="text" placeholder="מה עושים?" autocomplete="off">
      <button class="x" title="הסר שורה">×</button>`;
    const [time,text,del]=r.children;
    text.value=val;
    text.oninput =()=>{ put(sel,time.value,text.value); r.classList.toggle('full',!!text.value.trim()); paintStrip(); };
    time.onchange=()=>{
      const nt=time.value; if(!nt||nt===t){time.value=t;return}
      const dd=dayOf(sel), old=dd[t]??'';
      dd[nt]= dd[nt] ? dd[nt]+' · '+old : old;
      delete dd[t]; touch(); render();
    };
    del.onclick =()=>{ delete dayOf(sel)[t]; touch(); render(); };
    rows.append(r);
  }
  const add=document.createElement('button');
  add.id='add'; add.textContent='+ הוסף שעה';
  add.onclick=()=>{
    const used=new Set(timesFor(sel));
    // first free whole hour after the range, wrapping around the clock
    for(let i=1;i<=24;i++){
      const t=String((S.range.to+i)%24).padStart(2,'0')+':00';
      if(!used.has(t)){ dayOf(sel)[t]=''; touch(); render(); return; }
    }
  };
  rows.append(add);

  paintList(); paintStrip();
  $('#from').value=S.range.from; $('#fromV').textContent=String(S.range.from).padStart(2,'0')+':00';
  $('#to').value=S.range.to;     $('#toV').textContent=String(S.range.to).padStart(2,'0')+':00';
}

function paintList(){
  const box=$('#daylist'); box.textContent=''; let m=-1;
  for(const day of DAYS){
    const d=parse(day);
    if(d.getMonth()!==m){ m=d.getMonth();
      const h=document.createElement('div'); h.className='month';
      h.textContent=MO[m]+' '+d.getFullYear(); box.append(h); }
    const b=document.createElement('button');
    b.className='dayrow'+(day===sel?' on':'')+(day===TODAY?' today':'');
    const n=filled(day);
    b.innerHTML=`<span class="num">${d.getDate()}</span><span>${WD[d.getDay()]}</span>
                 <span class="cnt">${n||''}</span>`;
    b.onclick=()=>{sel=day;render()};
    box.append(b);
  }
}

function paintStrip(){
  const f=$('#film'); f.textContent='';
  for(const day of DAYS){
    const d=parse(day), n=filled(day), tot=timesFor(day).length||1;
    const c=document.createElement('button');
    c.className='cell'+(day===sel?' on':'')+(day===TODAY?' today':'');
    c.innerHTML=`<span class="w">${WD[d.getDay()]}</span><span class="d">${d.getDate()}</span>
                 <span class="m">${MO[d.getMonth()].slice(0,3)}</span>
                 <span class="bar"><i style="width:${Math.min(100,n/tot*100)}%"></i></span>`;
    c.onclick=()=>{sel=day;render()};
    f.append(c);
  }
  if(scrolledTo!==sel){ scrolledTo=sel;
    f.querySelector('.on')?.scrollIntoView({block:'nearest',inline:'center'}); }
}

/* ── controls ──────────────────────────────────────────────── */
$('#from').oninput=e=>{ S.range.from=+e.target.value;
  if(S.range.to<S.range.from) S.range.to=S.range.from; touch(); render(); };
$('#to').oninput=e=>{ S.range.to=+e.target.value;
  if(S.range.from>S.range.to) S.range.from=S.range.to; touch(); render(); };

$('#clearDay').onclick=()=>{ if(confirm('למחוק את כל מה שכתוב ביום הזה?')){ delete S.days[sel]; touch(); render(); } };
$('#copyPrev').onclick=()=>{
  const i=DAYS.indexOf(sel); if(i<1) return alert('אין יום קודם');
  S.days[sel]={...S.days[DAYS[i-1]]}; touch(); render();
};
$('#exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download='summer-plan.json'; a.click(); URL.revokeObjectURL(a.href);
};
$('#imp').onclick=()=>{
  const i=document.createElement('input'); i.type='file'; i.accept='.json';
  i.onchange=async()=>{ try{
      const o=JSON.parse(await i.files[0].text());
      if(!o.days) throw 0;
      S={...S,...o}; touch(); render();
    }catch(e){ alert('הקובץ לא תקין'); } };
  i.click();
};
$('#gear').onclick=()=>{ $('#right').classList.toggle('open'); $('#veil').classList.toggle('open'); };
$('#veil').onclick=()=>{ $('#right').classList.remove('open'); $('#veil').classList.remove('open'); };

/* ── sync link (once per device, kept out of the repo) ─────── */
function syncUI(){
  const auto = !localStorage.getItem(URLK) && CONFIG.url;
  $('#link').style.display = auto ? 'none' : '';
  $('#link').textContent = linked ? 'נתק את המכשיר הזה' : 'חבר סנכרון';
  $('#syncHint').textContent = linked
    ? 'מסתנכרן אוטומטית מול Supabase. חבר גם את הפלאפון כדי לראות שם אותו לוח.'
    : 'ללא סנכרון — נשמר בדפדפן הזה בלבד. "חבר סנכרון" מבקש כתובת פרויקט ומפתח anon, ושומר אותם במכשיר הזה בלבד.';
}
$('#link').onclick=async()=>{
  if(linked){
    if(!confirm('לנתק את המכשיר הזה? הנתונים יישארו ב-Supabase וגם כאן.')) return;
    localStorage.removeItem(URLK); localStorage.removeItem(KEYK);
    linked=false; syncUI(); say('נשמר במכשיר','ok'); return;
  }
  const u=prompt('כתובת הפרויקט ב-Supabase (https://xxxx.supabase.co):', sbUrl()); if(!u) return;
  const k=prompt('מפתח anon public:',''); if(!k) return;
  localStorage.setItem(URLK,u.trim()); localStorage.setItem(KEYK,k.trim());
  linked=true; say('מתחבר…','busy');
  try{
    const r=await R.load();
    if(r && r.updatedAt>S.updatedAt){ S=r; localStorage.setItem(LS,JSON.stringify(S)); render(); }
    else await R.save(S);
    say('מסונכרן','ok'); syncUI();
  }catch(e){
    linked=false; localStorage.removeItem(KEYK); syncUI(); say('החיבור נכשל','err');
    alert('לא הצלחתי להתחבר ('+e.message+').\nבדוק את הכתובת ואת המפתח, ושהרצת את ה-SQL שיוצר את טבלת plan.');
  }
};

/* ── boot ──────────────────────────────────────────────────── */
try{ const c=localStorage.getItem(LS); if(c) S={...S,...JSON.parse(c)}; }catch(e){}
syncUI();
say(linked?'מתחבר…':'נשמר במכשיר', linked?'busy':'ok');
render();
pull(); setInterval(pull,20000);
addEventListener('focus',pull);
document.addEventListener('visibilitychange',()=>!document.hidden&&pull());
addEventListener('beforeunload',e=>{ if(dirty&&linked){ e.preventDefault(); e.returnValue=''; } });
</script>
</body>
</html>
