<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>תוכנית הקיץ</title>
<meta name="theme-color" content="#7c3aed">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ── Light Studio: violet on white, radius 0 ──────────────── */
:root{
  --bg:#ffffff; --muted:#f5f3fb; --violet:#7c3aed; --violet-100:#ede9fe;
  --border:#e4def2; --ink:#111111; --sub:#5c5c66; --line:#e8e8ec;
  --faint:#78728a;   /* 4.59:1 על לבן — הבהיר ביותר שעדיין עובר AA */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:400 15px/1.5 Heebo,-apple-system,Segoe UI,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::selection{background:var(--violet-100)}

/* בגריד RTL העמודה הראשונה היא הימנית — לכן הפאנל מוגדר ראשון.
   רחב: היומן והיום זה לצד זה, כל אחד גולל בנפרד.
   צר: #stack הופך לגולל אחד והם נערמים. שניהם תמיד על המסך —
   אין מצב תצוגה ואין מסך להחליף. */
#app{
  height:100dvh; display:grid;
  grid-template-columns:280px 1fr;
  grid-template-rows:calc(58px + env(safe-area-inset-top)) 1fr;
  grid-template-areas:"top top" "side main";
}
/* ברירת המחדל היא הערימה, והמסך הרחב הוא היוצא מן הכלל — כך אין רוחב
   ביניים (למשל 1250.5px בזום/סקיילינג) שלא נתפס באף שאילתה */
#stack{display:block;grid-area:main;overflow-y:auto;overscroll-behavior:contain}
#cal,#day{background:var(--bg)}
#day{border-top:1px solid var(--line)}
@media(min-width:1251px){
  #app{grid-template-columns:280px 1fr 490px;
       grid-template-areas:"top top top" "side cal day"}
  #stack{display:contents}
  #cal{grid-area:cal}
  #day{grid-area:day;border-top:0;border-inline-start:1px solid var(--line)}
  #cal,#day{overflow-y:auto;overscroll-behavior:contain}
}
@media(max-width:900px){
  #app{grid-template-columns:1fr;grid-template-areas:"top" "main"}
}
/* טווח שעות הוא תמיד רצף LTR — אחרת ה-bidi הופך 09:00–11:30 ל-11:30–09:00 */
.ltr{direction:ltr;unicode-bidi:isolate}

/* ── top bar ──────────────────────────────────────────────── */
#top{
  grid-area:top; display:flex; align-items:center; gap:16px;
  padding:env(safe-area-inset-top) max(20px,env(safe-area-inset-right)) 0
          max(20px,env(safe-area-inset-left));
  border-bottom:1px solid var(--line); background:var(--bg);
}
#brand{font-weight:700;font-size:17px;letter-spacing:-.2px}
#brand em{font-style:normal;color:var(--violet)}
#brand span{font-weight:300;color:var(--sub);font-size:13px;margin-inline-start:10px}
#top .sp{flex:1}
#status{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;white-space:nowrap}
#status::before{content:"";width:7px;height:7px;border-radius:50%;background:#c9c4d6}
#status.ok::before{background:var(--violet)}
#status.busy::before{background:#f5a623}
#status.err::before{background:#c0392b}
#gear{display:none;font-size:19px;color:var(--sub);padding:4px 6px}
@media(max-width:900px){
  #gear{display:block} #brand span{display:none} #status{font-size:0;gap:0}
  #status::before{width:10px;height:10px}
  /* תקלת סנכרון היא הדבר האחרון שמותר לכווץ לנקודה — שם היא מוצגת במילים */
  #status.err{font-size:11.5px;gap:6px;color:#c0392b}
}

/* calendar — חודשים זה לצד זה כשיש רוחב, אחרת אחד מתחת לשני */
#cal{
  padding:22px 24px 60px; display:grid; gap:26px; align-content:start;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.mo{margin-bottom:0}
.mo h3{font-size:20px;font-weight:700;margin-bottom:14px}
.wd,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.wd span{
  padding:7px 0;text-align:center;font-size:12px;font-weight:500;
  color:var(--sub);background:var(--muted)}
.grid{background:var(--line);border:1px solid var(--line)}
.cell{
  background:var(--bg);min-height:104px;padding:7px 8px;text-align:start;
  display:flex;flex-direction:column;gap:3px;overflow:hidden;align-items:stretch}
.cell.pad{background:var(--muted);cursor:default}
.cell:not(.pad):hover{background:var(--muted)}
.cell .n{font-size:14px;font-weight:500;color:var(--sub);align-self:flex-start}
.cell.today .n{
  background:var(--violet);color:#fff;width:24px;height:24px;
  display:grid;place-items:center;font-weight:700}
.cell.sel{background:var(--muted);outline:2px solid var(--violet);outline-offset:-2px}
.evs{display:flex;flex-direction:column;gap:3px;min-width:0;margin-top:2px}
.cell .ev{
  font-size:11.5px;line-height:1.35;background:var(--violet-100);
  padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .more{font-size:11px;color:var(--sub);padding-inline-start:5px}
/* ── phone ────────────────────────────────────────────────────
   בתא של ~45px טקסט לא קריא, ולכן האירועים הופכים לריבועים
   (ריבוע ולא עיגול — הפלטה כולה radius 0). */
@media(max-width:700px){
  #cal{padding:12px 8px calc(40px + env(safe-area-inset-bottom))}
  .wd span{padding:6px 0;font-size:11px}
  .cell{min-height:62px;padding:5px 4px;gap:0;justify-content:flex-start}
  /* התאריך בפינה כמו בכל לוח שנה — מרכוז גרם לתא להיראות כמו אייקון */
  .cell .n{font-size:13px;align-self:flex-start}
  .cell.today .n{width:22px;height:22px;font-size:12px}
  .evs{flex-direction:row;flex-wrap:wrap;gap:2px;justify-content:flex-start;margin-top:4px}
  .cell .ev{width:6px;height:6px;padding:0;font-size:0;background:var(--violet);flex:none}
  .cell .more{font-size:10px;padding:0;line-height:1;color:var(--violet)}
}

/* day view */
#day{padding:26px 30px 70px;max-width:760px}
#dayhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
/* מוצמד לקצה, כדי שאורך שם היום לא יזיז את החצים */
.navs{margin-inline-start:auto;display:flex;gap:6px;flex:none}
#dayhead h1{font-size:27px;font-weight:700;letter-spacing:-.4px}
#dayhead h1 em{font-style:normal;color:var(--violet)}
.nav{
  width:32px;height:32px;border:1px solid var(--border);display:grid;
  place-items:center;color:var(--sub);font-size:15px;flex:none}
.nav:hover{border-color:var(--violet);color:var(--violet)}
.nav:disabled{opacity:.32;cursor:default;border-color:var(--border);color:var(--sub)}
#daysub{font-size:13.5px;color:var(--sub);margin-bottom:20px}

/* גלישה: בעמודה צרה שדה הטקסט יורד לשורה משלו במקום להצטמצם לכלום */
.r{display:flex;flex-wrap:wrap;align-items:center;gap:6px;
   border-bottom:1px solid var(--line);padding:7px 0}
.r:hover{background:var(--muted)}
.times{display:flex;align-items:center;gap:4px;flex:none}
.r input[type=time]{
  width:98px;background:none;border:1px solid transparent;color:var(--sub);
  font-size:14.5px;font-variant-numeric:tabular-nums;padding:5px 6px;cursor:pointer}
.r input[type=time]:hover{border-color:var(--border)}
.r input[type=time]:focus{outline:none;border-color:var(--violet);color:var(--ink)}
.times i{color:var(--sub);font-style:normal;font-size:12px}
.r input[type=text]{
  flex:1 1 150px;background:none;border:0;padding:8px 6px;font-size:15.5px;min-width:0}
.r input[type=text]:focus{outline:2px solid var(--violet);outline-offset:-2px}
.r input[type=text]::placeholder{color:var(--faint)}
.r.full input[type=time]{color:var(--violet);font-weight:500}
.r .x{flex:none;width:28px;color:var(--faint);font-size:18px;line-height:1}
.r:hover .x,.r:focus-within .x{color:var(--sub)}
.r .x:hover{color:#c0392b}
#add{
  margin-top:18px;font-size:14px;color:var(--violet);font-weight:500;
  padding:9px 16px;border:1px solid var(--border)}
#add:hover{background:var(--violet-100);border-color:var(--violet)}
#empty{color:var(--sub);font-size:14.5px;padding:22px 0 4px}

/* ── right panel ──────────────────────────────────────────── */
#right{
  grid-area:side;border-inline-end:1px solid var(--line);
  overflow-y:auto;background:var(--bg)}
.grp{padding:16px 18px;border-bottom:1px solid var(--line)}
.grp h4{
  font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--sub);
  text-transform:uppercase;margin-bottom:12px}
.btn{
  display:block;width:100%;padding:9px;margin-top:7px;font-size:14px;
  border:1px solid var(--border);color:var(--ink);font-weight:500}
.btn:hover{background:var(--muted);border-color:var(--violet);color:var(--violet)}
.hint{font-size:12.5px;color:var(--sub);line-height:1.65;margin-top:10px}
.stat{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.stat b{color:var(--violet);font-weight:700}

@media(max-width:900px){
  /* נפתח מאותו צד שבו יושב כפתור ☰ (הוא הילד האחרון, כלומר בשמאל ב-RTL) */
  #right{
    position:fixed;inset:0 auto 0 0;width:min(310px,86vw);z-index:20;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    transform:translateX(-100%);transition:transform .2s ease;
    box-shadow:8px 0 30px #11111122;border-inline-end:0}
  #right.open{transform:none}
  #veil{position:fixed;inset:0;background:#11111155;z-index:19;display:none}
  #veil.open{display:block}

  #day{padding:0 14px calc(50px + env(safe-area-inset-bottom))}
  /* הכותרת והחצים נשארים בהישג יד גם ביום עמוס */
  #dayhead{position:sticky;top:0;z-index:2;background:var(--bg);
           padding:14px 0 8px;margin-bottom:0}
  #dayhead h1{font-size:clamp(17px,5vw,20px)}
  #daysub{margin-bottom:12px}

  /* יעדי מגע: 44px, ו-16px בשדות כדי ש-iOS לא יזום בפוקוס */
  .nav{width:42px;height:42px;font-size:17px}
  #gear{padding:8px 10px;font-size:21px}
  /* השעות בשורה משלהן, ו-× יושב ליד הטקסט שהוא מוחק ולא ליד השעות */
  .r{gap:4px;padding:9px 0}
  .times{flex:0 0 100%}
  .r input[type=time]{width:112px;font-size:16px;padding:9px 6px}
  .r input[type=text]{order:2;flex:1 1 auto;font-size:16px;padding:6px 4px 8px}
  .r .x{order:3;width:42px;height:42px;font-size:22px}
  #add{width:100%;text-align:center;padding:13px;font-size:15px}
  .btn{padding:12px}
}
/* מגע: בלי הבהוב כחול, עם משוב לחיצה אמיתי */
@media(hover:none){
  *{-webkit-tap-highlight-color:transparent}
  .cell:active{background:var(--violet-100)}
  .btn:active,#add:active,.nav:active{background:var(--violet-100)}
  .r .x{color:var(--sub)}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div id="app">
  <header id="top">
    <div id="brand">תוכנית <em>הקיץ</em><span>8–31 באוגוסט 2026</span></div>
    <div class="sp"></div>
    <div id="status" role="status" aria-live="polite" aria-atomic="true">טוען…</div>
    <button id="gear" aria-label="הגדרות וגיבוי" aria-expanded="false">☰</button>
  </header>

  <div id="stack">
  <main id="cal"></main>
  <section id="day">
    <div id="dayhead">
      <h1></h1>
      <div class="navs">
        <button class="nav" id="prev" aria-label="יום קודם">→</button>
        <button class="nav" id="next" aria-label="יום הבא">←</button>
      </div>
    </div>
    <p id="daysub"></p>
    <div id="rows"></div>
  </section>
  </div>

  <aside id="right">
    <div class="grp">
      <h4>סיכום</h4>
      <div class="stat"><span>ימים בתוכנית</span><b id="sDays">0</b></div>
      <div class="stat"><span>אירועים בסך הכל</span><b id="sEv">0</b></div>
      <div class="stat"><span>ימים ריקים</span><b id="sEmpty">0</b></div>
    </div>
    <div class="grp">
      <h4>היום הנבחר</h4>
      <p class="hint" style="margin:0 0 10px">לכל אירוע שעת התחלה, ואפשר להוסיף גם שעת סיום. הרשימה מסתדרת לפי שעת ההתחלה.</p>
      <button class="btn" id="copyPrev">העתק מהיום הקודם</button>
      <button class="btn" id="clearDay">נקה את היום הזה</button>
    </div>
    <div class="grp">
      <h4>גיבוי</h4>
      <button class="btn" id="exp">ייצוא לקובץ</button>
      <button class="btn" id="imp">ייבוא מקובץ</button>
      <p class="hint" id="syncHint"></p>
    </div>
  </aside>
</div>
<div id="veil"></div>

<script>
/* ═══ סנכרון ═══════════════════════════════════════════════
   כל הלוח נשמר כמסמך JSON יחיד בשורה אחת בטבלת plan ב-Supabase. */
const CONFIG = { url:"https://xzeshpxkgwrgsfjogtho.supabase.co",
                 key:"sb_publishable_6CQcIi4__CXRgadDg9zIvw_yQrJpPA6" };
const URLK='sp-url', KEYK='sp-key';
// מקבל גם את כתובת ה-REST מעמוד Data API, לא רק את ה-Project URL
const sbUrl = () => (localStorage.getItem(URLK) || CONFIG.url || '')
                      .trim().replace(/\/+$/,'').replace(/\/rest\/v1$/,'');
const sbKey = () =>  localStorage.getItem(KEYK) || CONFIG.key || '';
/* ══════════════════════════════════════════════════════════ */

const START='2026-08-08', END='2026-08-31', LS='summer-plan';
const WD=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const WDS=['א','ב','ג','ד','ה','ו','ש'];
const MO=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>new Date(s+'T00:00:00');
const DAYS=(()=>{const a=[],d=parse(START),e=parse(END);while(d<=e){a.push(iso(d));d.setDate(d.getDate()+1)}return a})();
const TODAY=iso(new Date());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* days[date] = [{t:"HH:MM", e:"HH:MM"|"", x:"מה עושים"}], ממוין לפי t */
let S={v:3,updatedAt:0,days:{}};
let sel=DAYS.includes(TODAY)?TODAY:DAYS[0];
let dirty=false, saveT;
let linked = !!(sbUrl() && sbKey());

/* ── remote: the whole doc as jsonb in plan(id=1) ─────────── */
const R = {
  h(){ const k=sbKey();
       return {apikey:k, Authorization:'Bearer '+k, 'Content-Type':'application/json'}; },
  async load(){
    const r=await fetch(`${sbUrl()}/rest/v1/plan?id=eq.1&select=doc`,
                        {headers:this.h(), cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    return (await r.json())[0]?.doc || null;
  },
  async save(doc){
    const r=await fetch(`${sbUrl()}/rest/v1/plan`,{method:'POST',
      headers:{...this.h(), Prefer:'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify({id:1,doc})});
    if(!r.ok) throw new Error(r.status);
  }
};

const $=s=>document.querySelector(s);
const say=(t,c='')=>{const e=$('#status');e.textContent=t;e.className=c};

function touch(){
  S.updatedAt=Date.now();
  localStorage.setItem(LS,JSON.stringify(S));
  dirty=true;
  if(!linked){say('נשמר במכשיר','ok');return}
  say('שומר…','busy');
  clearTimeout(saveT); saveT=setTimeout(push,700);
}
async function push(){
  const stamp=S.updatedAt;
  try{ await R.save(S);
       // עריכה שנעשתה בזמן השמירה עדיין לא נשלחה — אסור לסמן "נקי"
       if(S.updatedAt===stamp) dirty=false;
       say('מסונכרן · '+new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}),'ok'); }
  catch(e){ say('אין חיבור — נשמר במכשיר','err'); clearTimeout(saveT); saveT=setTimeout(push,8000); }
}
const busy=()=>dirty||document.activeElement?.tagName==='INPUT';
async function pull(){
  if(!linked||busy()) return;
  try{
    const r=await R.load();
    // המצב יכול היה להשתנות תוך כדי הבקשה — בודקים שוב לפני שדורסים
    if(busy()) return;
    if(r && r.updatedAt>S.updatedAt){ S=r; migrate(S); localStorage.setItem(LS,JSON.stringify(S)); render(); }
    say('מסונכרן','ok');
  }catch(e){ say('אין חיבור — נשמר במכשיר','err'); }
}

const dayOf=day=>(S.days[day]||=[]);          // יוצר את היום — רק בעריכה
const filled=day=>(S.days[day]||[]).filter(e=>e.x.trim()).length;
const sorted=day=>[...(S.days[day]||[])].sort((a,b)=>a.t.localeCompare(b.t));

// ממיין את היום במקום. מזיז שורות קיימות ולא בונה מחדש — ציור מחדש בתוך
// blur מנתק את האלמנט שנלחץ, והלחיצה שגרמה ל-blur הייתה נבלעת.
const rowOf=new Map(), cellOf=new Map();
function resort(){
  const a=dayOf(sel), before=a.map(e=>e.t).join('|');
  a.sort((x,y)=>x.t.localeCompare(y.t));
  if(a.map(e=>e.t).join('|')!==before){
    const rows=$('#rows'), add=$('#add');
    a.forEach(ev=>{ const el=rowOf.get(ev); if(el) rows.insertBefore(el,add); });
  }
  refreshCell(sel);
}

/* v1 שמר {"HH:MM":"טקסט"} לכל יום; v2 היה [{t,x}] בלי שעת סיום.
   מאמת גם צורה — מסמך פגום מרחוק או מייבוא לא אמור להפיל את הדף. */
const HHMM=/^\d{2}:\d{2}$/;
function migrate(d){
  if(!d.days || typeof d.days!=='object') d.days={};
  for(const [day,v] of Object.entries(d.days)){
    const raw = Array.isArray(v) ? v
              : v && typeof v==='object' ? Object.entries(v).map(([t,x])=>({t,x})) : [];
    const evs = raw.filter(ev=>ev && typeof ev==='object' && HHMM.test(ev.t))
                   .map(ev=>({t:ev.t, e:HHMM.test(ev.e)?ev.e:'', x:String(ev.x??'')}))
                   .sort((a,b)=>a.t.localeCompare(b.t));
    evs.length ? d.days[day]=evs : delete d.days[day];   // לא לשמור ימים ריקים
  }
  delete d.range;
  d.v=3;
}

/* ── render ────────────────────────────────────────────────── */
function render(focusEv){
  paintCal(); paintDay(focusEv);
  paintStats();
}

const cellClass=day=>'cell'+(day===TODAY?' today':'')+(day===sel?' sel':'');
const cellLabel=day=>{ const d=parse(day), n=filled(day);
  return `${WD[d.getDay()]}, ${d.getDate()} ב${MO[d.getMonth()]}, `
       + (n?`${n} אירועים`:'ריק'); };
// ביומן רק מה עושים, בלי שעות — הסדר הכרונולוגי מגיע מ-sorted().
// במובייל .evs הופך לשורת ריבועים, כי טקסט בתא של 45px לא קריא.
function cellInner(day){
  const evs=sorted(day).filter(e=>e.x.trim());
  return `<span class="n">${parse(day).getDate()}</span><span class="evs">`
    + evs.slice(0,4).map(e=>`<span class="ev">${esc(e.x)}</span>`).join('')
    + (evs.length>4?`<span class="more">+${evs.length-4}</span>`:'')
    + `</span>`;
}
// עדכון תא בודד במקום בנייה מחדש של כל היומן (שומר על לחיצות ועל ביצועים)
function refreshCell(day){
  const c=cellOf.get(day); if(!c) return;
  c.className=cellClass(day); c.innerHTML=cellInner(day);
  c.setAttribute('aria-label',cellLabel(day));
}

function paintCal(){
  const box=$('#cal'); box.textContent=''; cellOf.clear();
  for(const m of [...new Set(DAYS.map(d=>d.slice(0,7)))]){
    const days=DAYS.filter(d=>d.startsWith(m)), first=parse(days[0]);
    const sec=document.createElement('section'); sec.className='mo';
    sec.innerHTML=`<h3>${MO[first.getMonth()]} ${first.getFullYear()}</h3>
      <div class="wd">${WDS.map(w=>`<span>${w}</span>`).join('')}</div>`;
    const grid=document.createElement('div'); grid.className='grid';
    for(let i=0;i<first.getDay();i++){
      const p=document.createElement('div'); p.className='cell pad'; grid.append(p);
    }
    for(const day of days){
      const c=document.createElement('button');
      c.className=cellClass(day);
      c.innerHTML=cellInner(day);
      c.setAttribute('aria-label',cellLabel(day));
      // במסך צר עורך היום נמצא מתחת ליומן, ולכן מגלגלים אליו
      c.onclick=()=>{ sel=day; render();
                      $('#day').scrollIntoView({block:'nearest',behavior:'smooth'}); };
      cellOf.set(day,c);
      grid.append(c);
    }
    sec.append(grid); box.append(sec);
  }
}

function paintDay(focusEv){
  const d=parse(sel), n=filled(sel);
  $('#dayhead h1').innerHTML=`יום <em>${WD[d.getDay()]}</em>, ${d.getDate()} ב${MO[d.getMonth()]}`;
  $('#daysub').textContent = n ? `${n} אירועים` : 'עדיין לא תוכנן כלום';
  $('#prev').disabled = DAYS.indexOf(sel)===0;
  $('#next').disabled = DAYS.indexOf(sel)===DAYS.length-1;

  const rows=$('#rows'); rows.textContent=''; rowOf.clear();
  const evs=sorted(sel);
  for(const ev of evs){
    const r=document.createElement('div');
    r.className='r'+(ev.x.trim()?' full':'');
    r.innerHTML=`<span class="times ltr">
        <input type="time" value="${esc(ev.t)}" aria-label="שעת התחלה">
        <i aria-hidden="true">–</i>
        <input type="time" value="${esc(ev.e)}" aria-label="שעת סיום (לא חובה)">
      </span>
      <input type="text" placeholder="מה עושים?" aria-label="מה עושים?" autocomplete="off">
      <button class="x" aria-label="מחק אירוע">×</button>`;
    const [times,text,del]=r.children;
    const [from,,to]=times.children;
    text.value=ev.x;
    // רק התא ביומן מתעדכן בהקלדה — ציור השורות היה הורס את מיקום הסמן
    text.oninput =()=>{ ev.x=text.value; r.classList.toggle('full',!!text.value.trim());
                        touch(); refreshCell(sel); };
    // שדה time יורה change כבר כשהערך תקין, כלומר באמצע ההקלדה. ציור מחדש
    // שם היה הורס את השדה תוך כדי — לכן change רק שומר, והמיון קורה ב-blur.
    from.onchange=()=>{ if(from.value){ ev.t=from.value; touch(); } };
    to.onchange  =()=>{ ev.e=to.value; touch(); };
    from.onblur  =()=>{ if(!from.value){ from.value=ev.t; return }
                        if(from.value!==ev.t){ ev.t=from.value; touch(); }
                        resort(); };
    del.onclick  =()=>{ if(ev.x.trim() && !confirm(`למחוק את "${ev.x.trim()}"?`)) return;
                        const a=dayOf(sel); a.splice(a.indexOf(ev),1); touch(); render(); };
    rowOf.set(ev,r);
    rows.append(r);
    if(ev===focusEv) queueMicrotask(()=>text.focus());
  }
  if(!evs.length){
    const p=document.createElement('p'); p.id='empty';
    p.textContent='אין עדיין אירועים ביום הזה.'; rows.append(p);
  }
  const add=document.createElement('button');
  add.id='add'; add.textContent='+ הוסף אירוע';
  add.onclick=()=>{
    const a=dayOf(sel);
    const last=a.length ? Math.max(...a.map(e=>+e.t.slice(0,2))) : 8;
    const ev={t:String(Math.min(last+1,23)).padStart(2,'0')+':00', e:'', x:''};
    a.push(ev); touch(); render(ev);
  };
  rows.append(add);
}

function paintStats(){
  const evs=DAYS.reduce((s,d)=>s+filled(d),0);
  $('#sDays').textContent=DAYS.length;
  $('#sEv').textContent=evs;
  $('#sEmpty').textContent=DAYS.filter(d=>!filled(d)).length;
}

/* ── controls ──────────────────────────────────────────────── */
const go=n=>{ const i=DAYS.indexOf(sel)+n;
              if(i>=0&&i<DAYS.length){ sel=DAYS[i]; render(); } };
$('#prev').onclick=()=>go(-1);
$('#next').onclick=()=>go(1);

$('#clearDay').onclick=()=>{
  if(confirm(`למחוק את כל האירועים ב-${parse(sel).getDate()} ב${MO[parse(sel).getMonth()]}?`)){
    delete S.days[sel]; touch(); render(); } };
$('#copyPrev').onclick=()=>{
  const i=DAYS.indexOf(sel); if(i<1) return alert('אין יום קודם');
  const src=S.days[DAYS[i-1]]||[];
  if(!src.length) return alert('היום הקודם ריק — אין מה להעתיק');
  if(filled(sel) && !confirm('ליום הזה כבר יש אירועים. להחליף אותם?')) return;
  S.days[sel]=src.map(e=>({...e})); touch(); render();
};
$('#exp').onclick=()=>{
  const a=document.createElement('a'), url=URL.createObjectURL(
    new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.href=url; a.download='summer-plan.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);   // ביטול מיידי קטע הורדות
};
$('#imp').onclick=()=>{
  const i=document.createElement('input'); i.type='file'; i.accept='.json';
  i.onchange=async()=>{ try{
      const o=JSON.parse(await i.files[0].text());
      if(!o || typeof o!=='object' || !o.days || typeof o.days!=='object') throw 0;
      const next={...S,...o};
      migrate(next);              // מאמת על עותק — קובץ פגום לא נוגע במצב הקיים
      S=next; touch(); render();
    }catch(e){ alert('הקובץ לא תקין'); } };
  i.click();
};
const drawer=open=>{ $('#right').classList.toggle('open',open);
                     $('#veil').classList.toggle('open',open);
                     $('#gear').setAttribute('aria-expanded',open);
                     if(open) $('#right').querySelector('.btn')?.focus();
                     else $('#gear').focus(); };
$('#gear').onclick=()=>drawer(!$('#right').classList.contains('open'));
$('#veil').onclick=()=>drawer(false);
addEventListener('keydown',e=>{
  if(e.key==='Escape' && $('#right').classList.contains('open')) drawer(false); });

/* ── boot ──────────────────────────────────────────────────── */
try{ const c=localStorage.getItem(LS); if(c) S={...S,...JSON.parse(c)}; }catch(e){}
migrate(S);
$('#syncHint').textContent = linked
  ? 'הלוח מסתנכרן אוטומטית בין כל המכשירים. הייצוא הוא גיבוי נוסף.'
  : 'ללא סנכרון — נשמר בדפדפן הזה בלבד.';
say(linked?'מתחבר…':'נשמר במכשיר', linked?'busy':'ok');
render();
pull(); setInterval(pull,20000);
addEventListener('focus',pull);
document.addEventListener('visibilitychange',()=>!document.hidden&&pull());
addEventListener('beforeunload',e=>{ if(dirty&&linked){ e.preventDefault(); e.returnValue=''; } });
</script>
</body>
</html>
